# plumlang.org
#
# Prose lives here; the API reference does not. `plum doc --stdlib --html`
# emits the reference, and `bootstrap/build-site` drops it into `public/api`
# after Hugo has run. Two generators, one tree, one deploy.
#
# The reference is deliberately NOT run through Hugo. It is the compiler's
# own output, and the day it renders differently here than it does for a
# user running `plum doc` on their own package is the day this site stops
# being a demonstration of the tool.

baseURL = "https://plumlang.org/"
languageCode = "en-us"
title = "Plum"
enableEmoji = false

# No blog, no tags. A taxonomy page nobody wrote content for is a
# published empty page.
disableKinds = ["taxonomy", "term", "RSS"]

# The site is built on deploy and never committed, so a stale `public/`
# from a local run must not leak into the next one.
cleanDestinationDir = true

[markup.goldmark.renderer]
  # The prose is ours, from the repository's own Markdown files.
  unsafe = true

[markup.highlight]
  # `noClasses = false` puts highlighting in the stylesheet rather than
  # inline on every token, so code blocks follow the same theme variables
  # as everything else -- including the generated reference's.
  noClasses = false
  style = "algol_nu"
  lineNos = false

[params]
  description = "A small, self-hosted, ML-family language."
  repo = "https://github.com/bradcypert/plum"
  tagline = "An ML-family language whose compiler is written in itself. Errors are values, every match is checked for exhaustiveness, and memory is reference counted with reuse rather than collected."

# The home page's claims, kept as data so the layout stays about layout.
# Every one of these is a fact about the repository, not a slogan -- if
# one stops being true it should be edited here and noticed.
[[params.facts]]
  title = "It is self-hosted"
  body = "The compiler is written in Plum, and builds itself. Nothing in the toolchain needs another language; <code>clang</code> assembles and links what it emits, and that is the only requirement."
[[params.facts]]
  title = "No garbage collector, no manual frees"
  body = "Memory is reference counted with reuse analysis, in the <a href=\"https://www.microsoft.com/en-us/research/publication/perceus-garbage-free-reference-counting-with-reuse/\">Perceus</a> tradition. A dying cell is written into rather than freed and allocated again."
[[params.facts]]
  title = "Errors are values"
  body = "No exceptions, and no early <code>return</code>. A function that can fail says so in its type, and the compiler will not let you forget a case."
[[params.facts]]
  title = "It talks to the operating system"
  body = "Sockets, HTTP, processes, files, time, terminals. The standard library is ordinary Plum over a small set of C shims, and its reference is generated by <code>plum doc</code>."



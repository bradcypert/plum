{{ define "main" }}
<section class="hero">
  <h1>A small language that<br>compiles itself.</h1>
  <p class="lede">{{ .Site.Params.tagline }}</p>
  <p class="cta">
    <a class="primary" href="{{ "/install/" | relURL }}">Install</a>
    <a href="{{ "/tutorial/" | relURL }}">Read the tutorial</a>
  </p>
</section>

<section class="sample">
{{ .Content }}
</section>

<section class="facts">
  <h2>What it is</h2>
  <dl>
    {{ range .Site.Params.facts }}
      <div><dt>{{ .title }}</dt><dd>{{ .body | safeHTML }}</dd></div>
    {{ end }}
  </dl>
</section>
{{ end }}

# Builds Plum the way a fresh clone does -- from the checked-in seed,
# with clang and nothing else -- and then runs the harnesses that need
# no Rust toolchain.
#
# The seed path is the point. `bootstrap/seed/plum.ll` is the
# self-hosted compiler shipped as LLVM IR, because building a compiler
# written in Plum requires a Plum compiler to start from. If that stops
# working, nobody can build this project at all, and this is the job
# that says so.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bootstrap:
    name: build from seed and validate
    runs-on: ubuntu-latest
    # A runner that never arrives must fail in minutes, not in
    # GitHub's default 24 hours. See the retired-image note above.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          clang --version

      # BEST EFFORT, and it must never fail the build. Only
      # `examples/asteroids` needs raylib, through its own native shim.
      # With the headers present the example is LINKED as well as
      # emitted; without them `bootstrap/example-sweep` reports it as
      # emitted-but-not-linked and carries on.
      #
      # This is here because the first release attempt died on exactly
      # this: raylib happened to be installed on the developer's
      # machine, so the sweep passed locally and failed on a clean
      # runner.
      - name: raylib, if it is available
        continue-on-error: true
        run: sudo apt-get install -y libraylib-dev || echo "raylib not available; asteroids will be emit-only"

      # Two builds, not one. The first proves the SEED still works; the
      # second proves the compiler it produced can build today's source.
      # `bootstrap/check-seed` asserts the stronger property -- that the
      # result is byte-identical to the current compiler -- and runs
      # below.
      - name: seed -> compiler
        run: |
          ./bootstrap/from-seed -o sh.seed
          ./sh.seed build bootstrap/self_host -o sh.real
          ./sh version

      - name: the seed is still current
        run: ./bootstrap/check-seed

      - name: the compiler reproduces itself
        run: ./bootstrap/bootstrap-check

      - name: it can build itself with no Rust, from any directory
        run: ./bootstrap/self-sufficiency

      - name: corpus
        run: ./bootstrap/corpus-check

      - name: examples
        run: ./bootstrap/example-sweep

      - name: embedded C shims match native_stdlib/
        run: ./bootstrap/check-shims

      - name: no runtime declare goes unused
        run: ./bootstrap/check-declares

      - name: plum test really runs tests
        run: ./bootstrap/test-smoke

      # Invariants checked against generated inputs, not recorded
      # answers. This catches the class `interp-check` cannot: a bug
      # the compiler and the interpreter SHARE. Both bugs it found on
      # the day it was written were of that kind, and the interpreter
      # agreed with the compiler on both.
      - name: properties hold
        run: ./bootstrap/property-check

      # The tutorial's snippets are compiled and run against the output
      # it claims. Documentation is the one part of this repository
      # that has rotted repeatedly, and it is the only part prose alone
      # cannot test.
      - name: the tutorial still works
        run: ./bootstrap/doc-check
      - name: every builtin method is offered by completion
        run: ./bootstrap/check-builtins
      - name: every stdlib name the docs mention exists
        run: ./bootstrap/check-doc-names

      # Allocation counts. Refcount churn creeps back in silently, and
      # the language's central claim is a number nobody was looking at
      # until this existed. Fails on a rise, reports a fall.
      - name: allocations have not risen
        run: ./bootstrap/alloc-check

      # Two properties about SOURCE rather than about behaviour, and
      # neither was gated here until 2026-08-30 -- so a formatting drift
      # or a broken token span could land on main while every local run
      # stayed green.
      #
      # `lossless-check` is the floor the formatter stands on: every
      # `.plum` file round-trips through the token stream byte for byte,
      # and nothing but whitespace and comments sits between tokens.
      # `fmt-check` is the formatter itself -- every file already
      # formatted, `fmt` changing only what it claims to, and the
      # `fmt_corpus` fixtures reformatted as recorded.
      - name: the token stream loses nothing
        run: ./bootstrap/lossless-check

      - name: everything is already formatted
        run: ./bootstrap/fmt-check

      - name: the language server answers a real session
        run: ./bootstrap/lsp-smoke

      - name: TCP and HTTP work in a compiled binary
        run: ./bootstrap/net-smoke

      - name: the version string is consistent
        run: ./bootstrap/check-version

  # Does the compiler work somewhere that is not the developer's Linux
  # box? Only `bootstrap/platform-smoke` runs here, deliberately -- see
  # that script's header. The rest of `bootstrap/` is Linux-only
  # tooling (GNU `timeout`, ASan leak detection, the `./sh` cgroup
  # wrapper), and making it portable would be work spent on the
  # development environment rather than on the thing users install.
  #
  # Correctness is still established on Linux. What this leg answers is
  # narrower and is the question that does not transfer: does the
  # bootstrap path work, does the shell-out to `clang` work, do the
  # embedded C shims compile against a different libc, and do real
  # programs still print the right thing.
  #
  # macos-15 is arm64, which is also the second CPU architecture this
  # project targets -- so one runner covers a second OS and a second
  # architecture at once. It finishes in under a minute.
  #
  # **Intel macOS is deliberately NOT here**, and is in `release.yml`
  # instead, as `macos-15-intel`. It was `macos-13` on both until
  # 2026-08-25, when that image turned out to have been RETIRED --
  # `actions/runner-images` publishes only macos-15 and macos-26 now.
  #
  # A `runs-on` naming a retired image does not fail. It queues until
  # GitHub's 24-hour job timeout kills it, and while it waits the whole
  # RUN counts as in progress, so no job's logs can be downloaded. One
  # run here sat at `24h0m1s` and blocked every other leg's diagnosis
  # for a day. Every job in both workflows now sets `timeout-minutes`.
  #
  # (Cost is not the reason. This repository is public, so Actions
  # minutes are free on every runner size.)
  platforms:
    name: ${{ matrix.os }} builds and runs real programs
    runs-on: ${{ matrix.os }}
    # A runner that never arrives must fail in minutes, not in
    # GitHub's default 24 hours. See the retired-image note above.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    steps:
      - uses: actions/checkout@v4

      # clang ships with the Xcode command line tools, already present
      # on every GitHub macOS runner. Printed rather than installed so
      # a failure names the version that produced it.
      - name: clang version
        run: clang --version

      - name: seed -> compiler
        run: |
          ./bootstrap/from-seed -o sh.seed
          ./sh.seed build bootstrap/self_host -o sh.real

      - name: the compiler it built works
        run: ./bootstrap/platform-smoke ./sh.real

      # The language server is the one feature that was BROKEN on macOS
      # and fixed blind: it re-invokes the compiler through
      # `/proc/self/exe`, which does not exist here, so it could never
      # have worked. `Os.self_exe` replaced that, and nothing tested
      # the result on a Mac until this step. Shipping a release that
      # advertises editor support without ever running it on the
      # platform is the gap this closes.
      #
      # `lsp-smoke` needs a Python only to BUILD the session -- a stream
      # of Content-Length-framed JSON. macOS runners have one.
      - name: the language server answers a real session
        run: ./bootstrap/lsp-smoke ./sh.real

  # Linux on arm64 -- a second ARCHITECTURE on the reference OS.
  #
  # It runs MORE than the macOS and Windows legs, not less, and that is
  # the point: this is Linux, so AddressSanitizer with
  # `detect_leaks=1` works here. Plum is reference counted, so a leak
  # is a miscompile, and a miscompile is exactly what a new
  # architecture is most likely to produce. Checking only that programs
  # print the right bytes would miss the class of bug worth looking for.
  #
  # Nothing is PUBLISHED for this platform yet. The rule is that a
  # platform earns a release job by being green here first; when it
  # has been, add it to `release.yml` and move it up the tier table in
  # README.md.
  linux-arm64:
    name: linux arm64 builds and runs real programs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          clang --version

      - name: seed -> compiler
        run: |
          ./bootstrap/from-seed -o sh.seed
          ./sh.seed build bootstrap/self_host -o sh.real

      - name: the compiler reproduces itself
        run: ./bootstrap/bootstrap-check

      # The leak oracle, which only Linux has.
      - name: corpus
        run: ./bootstrap/corpus-check

      - name: the compiler it built works
        run: ./bootstrap/platform-smoke ./sh.real

      - name: the language server answers a real session
        run: ./bootstrap/lsp-smoke ./sh.real

      - name: properties hold
        run: ./bootstrap/property-check ./sh.real

  # Windows, under MSYS2/MinGW. This was `continue-on-error` while the
  # port was being written blind; it went green on 2026-08-25 -- 43 of
  # 43 programs at the time -- and the marker came off in the same
  # commit. A failure
  # here is now a real failure.
  #
  # MSYS2 rather than MSVC: MinGW keeps `dirent.h`, pthreads and bash
  # working, so `from-seed` and `platform-smoke` run unmodified and the
  # port was scoped to the shims that genuinely differ.
  #
  # `lsp-smoke` runs here too, since 2026-08-25. It needs a Python to
  # build the session, hence `python` in the install list below --
  # MSYS2 spells it without the 3, which is why the harness looks for
  # both names.
  windows:
    name: windows x86_64 builds and runs real programs
    runs-on: windows-latest
    # A runner that never arrives must fail in minutes, not in
    # GitHub's default 24 hours. See the retired-image note above.
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            diffutils
            tar
            python

      - name: clang version
        run: clang --version

      - name: seed -> compiler
        run: |
          ./bootstrap/from-seed -o sh.seed
          ./sh.seed build bootstrap/self_host -o sh.real

      - name: the compiler it built works
        run: ./bootstrap/platform-smoke ./sh.real

      # The last untested feature on any published platform. The
      # language server re-invokes the compiler through `Os.self_exe`,
      # which is `GetModuleFileNameA` here -- written blind, never run.
      - name: the language server answers a real session
        run: ./bootstrap/lsp-smoke ./sh.real

# Builds and publishes plumlang.org.
#
# The site is built on deploy and never committed. Two generators feed
# one tree: Hugo renders the prose, and `plum doc --stdlib --html`
# renders the API reference -- which means the reference published here
# is generated by the compiler at that commit, and cannot describe a
# standard library that no longer exists.
#
# That is also why this job builds the compiler from the seed rather
# than downloading a release. A release is the LAST published version;
# `main` is what the prose on the site describes.
name: site

on:
  push:
    branches: [main]
    # Everything the site is made of. A change to the compiler can
    # change the reference, so `bootstrap/self_host` is in the list.
    paths:
      - 'site/**'
      - 'bootstrap/**'
      - 'native_stdlib/**'
      - '*.md'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# One deploy at a time, and let a newer commit win: a queued build of
# an older `main` has nothing useful to publish once it is superseded.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - uses: peaceiris/actions-hugo@v3
        with:
          # `extended` for the SCSS pipeline Hugo's asset handling
          # wants; pinned because a site build that changes underneath
          # you is a site that breaks on a day you did not touch it.
          hugo-version: '0.163.3'
          extended: true

      - name: build the compiler from the seed
        run: |
          ./bootstrap/from-seed -o plum
          ./plum build bootstrap/self_host -o plum

      - name: build the site
        run: PLUM=./plum ./bootstrap/build-site

      # The site build calls `plum highlight` on every code block; this
      # is what says the highlighter did not eat any of them.
      - name: check the highlighter round-trips
        run: PLUM=./plum ./bootstrap/highlight-check

      # A published site with a dead link is worse than one page late.
      - name: check internal links
        run: python3 bootstrap/check-site-links site/public

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

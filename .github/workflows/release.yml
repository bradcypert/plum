# Publishes a release when a `v*` tag is pushed.
#
# The artifact is a single binary per platform. Plum's compiler shells
# out to `clang` at build time -- that is how it assembles and links
# what it emits -- so a user needs clang on their PATH, and needs
# nothing else. The C shims are embedded in the compiler itself
# (`bootstrap/gen-shims`), which is what makes a lone binary enough.
#
# Three jobs, not one: `linux` and `macos` each BUILD and validate a
# tarball, and `publish` uploads whatever they produced. Split that way
# because the two do genuinely different amounts of checking. Linux runs
# the full harness suite and is where correctness is established. macOS
# runs only `bootstrap/platform-smoke`, because the rest of `bootstrap/`
# is Linux-only development tooling (GNU `timeout`, ASan leak detection,
# the `./sh` cgroup wrapper) and porting it would be effort spent on the
# development environment rather than on what users install.
#
# The rule from the first release still holds and is what these jobs
# implement: a platform gets published only once something in CI builds
# and runs real programs on it. Nothing is shipped that is merely
# expected to work.
#
# Windows is not here yet. It needs four of the five C shims rewritten
# against Win32 and Winsock, and it needs the compiler itself to stop
# shelling out to `mktemp` and `rm`. See PORTING.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    name: linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          clang --version

      # BEST EFFORT, and it must never fail the build. Only
      # `examples/asteroids` needs raylib, through its own native shim.
      # With the headers present the example is LINKED as well as
      # emitted; without them `bootstrap/example-sweep` reports it as
      # emitted-but-not-linked and carries on.
      #
      # This is here because the first release attempt died on exactly
      # this: raylib happened to be installed on the developer's
      # machine, so the sweep passed locally and failed on a clean
      # runner.
      - name: raylib, if it is available
        continue-on-error: true
        run: sudo apt-get install -y libraylib-dev || echo "raylib not available; asteroids will be emit-only"

      # From the SEED, not from a compiler built some other way: this
      # is the same path a user takes, so the released binary is the
      # one the documented instructions produce.
      - name: seed -> compiler -> compiler
        run: |
          ./bootstrap/from-seed -o sh.seed
          ./sh.seed build bootstrap/self_host -o sh.real

      # A tag that disagrees with the version the binary REPORTS would
      # publish a release that lies about itself. Checked before
      # anything is uploaded, and checked HERE only -- there is one
      # version string and one tag, so checking it once is enough.
      - name: tag and version agree
        run: ./bootstrap/check-version "${{ github.event.inputs.tag || github.ref_name }}"

      # The release is not the place to discover a broken compiler.
      - name: validate
        run: |
          ./bootstrap/check-seed
          ./bootstrap/bootstrap-check
          ./bootstrap/self-sufficiency
          ./bootstrap/corpus-check
          ./bootstrap/example-sweep
          ./bootstrap/check-shims
          ./bootstrap/test-smoke
          ./bootstrap/net-smoke
          ./bootstrap/lsp-smoke

      - name: package
        run: ./bootstrap/package-release sh.real x86_64-linux

      - uses: actions/upload-artifact@v4
        with:
          name: plum-x86_64-linux
          path: dist/*
          if-no-files-found: error

  macos:
    name: macos ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 runners are Apple Silicon, macos-13 are Intel.
          # Both are built because a Mac user has no way to run the
          # other one well, and because arm64 is the first non-x86
          # target this project has ever produced a binary for.
          - os: macos-15
            arch: arm64-macos
          - os: macos-13
            arch: x86_64-macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # clang ships with the Xcode command line tools, already present
      # on every GitHub macOS runner.
      - name: clang version
        run: clang --version

      - name: seed -> compiler -> compiler
        run: |
          ./bootstrap/from-seed -o sh.seed
          ./sh.seed build bootstrap/self_host -o sh.real

      # The one harness that runs here. It builds and runs all 42
      # execution fixtures through `plum build`, which is the path a
      # user takes, and is what would catch a libc difference.
      - name: validate
        run: ./bootstrap/platform-smoke ./sh.real

      - name: package
        run: ./bootstrap/package-release sh.real ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: plum-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: collect
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -l dist

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: plum ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*

# Publishes a release when a `v*` tag is pushed.
#
# The artifact is a single binary per platform. Plum's compiler shells
# out to `clang` at build time -- that is how it assembles and links
# what it emits -- so a user needs clang on their PATH, and needs
# nothing else. The C shims are embedded in the compiler itself
# (`bootstrap/gen-shims`), which is what makes a lone binary enough.
#
# Three jobs, not one: `linux` and `macos` each BUILD and validate a
# tarball, and `publish` uploads whatever they produced. Split that way
# because the two do genuinely different amounts of checking. Linux runs
# the full harness suite and is where correctness is established. macOS
# runs only `bootstrap/platform-smoke`, because the rest of `bootstrap/`
# is Linux-only development tooling (GNU `timeout`, ASan leak detection,
# the `./sh` cgroup wrapper) and porting it would be effort spent on the
# development environment rather than on what users install.
#
# The rule from the first release still holds and is what these jobs
# implement: a platform gets published only once something in CI builds
# and runs real programs on it. Nothing is shipped that is merely
# expected to work.
#
# Windows builds under MSYS2/MinGW. It runs `platform-smoke` only, like
# macOS, for the same reason: the rest of `bootstrap/` is Linux-only
# development tooling. Its archive carries `plum.exe`, which
# `package-release` names from the platform slug.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  # Fails a mis-tagged release in SECONDS, before three platforms each
  # spend minutes building something that can never be published.
  #
  # `v0.0.3` was first tagged on a commit whose `plum_version` still
  # said 0.0.2. The Linux job caught it -- that check has always been
  # there -- but only after macOS and Windows had built and packaged
  # 0.0.2-named artifacts. Nothing wrong was published, because
  # `publish` needs all three; it was just nine minutes of work that
  # could not have led anywhere.
  #
  # Source against tag only. A stale BINARY is invisible to that, which
  # is why the full three-way check still runs in `linux` below.
  version:
    name: tag and version agree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: source declares the tagged version
        run: ./bootstrap/check-version --source-only "${{ github.event.inputs.tag || github.ref_name }}"

  linux:
    needs: version
    name: linux x86_64
    runs-on: ubuntu-latest
    # A runner that never arrives must fail fast rather than hold the
    # release for GitHub's 24-hour default. See the macos-13 note above.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          clang --version

      # BEST EFFORT, and it must never fail the build. Only
      # `examples/asteroids` needs raylib, through its own native shim.
      # With the headers present the example is LINKED as well as
      # emitted; without them `bootstrap/example-sweep` reports it as
      # emitted-but-not-linked and carries on.
      #
      # This is here because the first release attempt died on exactly
      # this: raylib happened to be installed on the developer's
      # machine, so the sweep passed locally and failed on a clean
      # runner.
      - name: raylib, if it is available
        continue-on-error: true
        run: sudo apt-get install -y libraylib-dev || echo "raylib not available; asteroids will be emit-only"

      # From the SEED, not from a compiler built some other way: this
      # is the same path a user takes, so the released binary is the
      # one the documented instructions produce.
      - name: seed -> compiler -> compiler
        run: |
          ./bootstrap/from-seed -o sh.seed
          ./sh.seed build bootstrap/self_host -o sh.real

      # The FULL three-way check: source, tag, and the version the
      # built binary actually reports. The `version` job above already
      # compared source against tag; what it could not do is notice a
      # STALE BINARY, because it has no compiler. This is the half that
      # can, which is why it stays here rather than moving into the
      # gate.
      - name: tag and version agree
        run: ./bootstrap/check-version "${{ github.event.inputs.tag || github.ref_name }}"

      # The release is not the place to discover a broken compiler.
      - name: validate
        run: |
          ./bootstrap/check-seed
          ./bootstrap/bootstrap-check
          ./bootstrap/self-sufficiency
          ./bootstrap/corpus-check
          ./bootstrap/example-sweep
          ./bootstrap/check-shims
          ./bootstrap/test-smoke
          ./bootstrap/net-smoke
          ./bootstrap/lsp-smoke

      - name: package
        run: ./bootstrap/package-release sh.real x86_64-linux

      - uses: actions/upload-artifact@v4
        with:
          name: plum-x86_64-linux
          path: dist/*
          if-no-files-found: error

  macos:
    needs: version
    name: macos ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    # A runner that never arrives must fail fast rather than hold the
    # release for GitHub's 24-hour default. See the macos-13 note above.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # `macos-15` is Apple Silicon; `macos-15-intel` is the
          # x86_64 image of the same OS. Both are built because a Mac
          # user cannot run the other one natively, and because arm64
          # is the first non-x86 target this project has produced a
          # binary for.
          #
          # This said `macos-13` until 2026-08-25, which by then no
          # longer EXISTED -- `actions/runner-images` publishes only
          # macos-15 and macos-26 now. A `runs-on` naming a retired
          # image does not fail; it queues until GitHub's 24-hour job
          # timeout kills it, which is how one CI run sat at
          # `24h0m1s` and blocked every other job's logs for a day.
          # Hence `timeout-minutes` below.
          - os: macos-15
            arch: arm64-macos
          - os: macos-15-intel
            arch: x86_64-macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # clang ships with the Xcode command line tools, already present
      # on every GitHub macOS runner.
      - name: clang version
        run: clang --version

      - name: seed -> compiler -> compiler
        run: |
          ./bootstrap/from-seed -o sh.seed
          ./sh.seed build bootstrap/self_host -o sh.real

      # The one harness that runs here. It builds and runs all 42
      # execution fixtures through `plum build`, which is the path a
      # user takes, and is what would catch a libc difference.
      - name: validate
        run: ./bootstrap/platform-smoke ./sh.real

      - name: package
        run: ./bootstrap/package-release sh.real ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: plum-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    needs: version
    name: windows x86_64
    runs-on: windows-latest
    # A runner that never arrives must fail fast rather than hold the
    # release for GitHub's 24-hour default. See the macos-13 note above.
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            diffutils
            tar

      - name: clang version
        run: clang --version

      - name: seed -> compiler -> compiler
        run: |
          ./bootstrap/from-seed -o sh.seed
          ./sh.seed build bootstrap/self_host -o sh.real

      - name: validate
        run: ./bootstrap/platform-smoke ./sh.real

      # The archive is a .tar.gz like every other platform's. Windows
      # has shipped `tar` in-box since Windows 10 1803, so this needs no
      # extra tool -- and one archive format keeps `package-release`,
      # the checksum step and the docs from growing a special case.
      - name: package
        run: ./bootstrap/package-release sh.real x86_64-windows

      - uses: actions/upload-artifact@v4
        with:
          name: plum-x86_64-windows
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    # A runner that never arrives must fail fast rather than hold the
    # release for GitHub's 24-hour default. See the macos-13 note above.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: collect
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -l dist

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: plum ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*

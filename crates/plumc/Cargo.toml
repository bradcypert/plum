[package]
name = "plumc"
version.workspace = true
edition.workspace = true

[[bin]]
name = "plum"
path = "src/main.rs"

[dependencies]
plum-syntax = { path = "../plum-syntax" }
plum-ir = { path = "../plum-ir" }
plum-interp = { path = "../plum-interp" }
plum-types = { path = "../plum-types" }
# `plum lsp` only — see `src/lsp.rs`'s own doc comment for why these
# are judged exempt from the usual "would a future self-hosted Plum
# compiler need to reimplement this" scrutiny: this is dev-tooling
# shipped alongside the compiler, not the compiler (or its runtime)
# itself.
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "time"] }
